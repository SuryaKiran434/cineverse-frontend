# SonarCloud configuration for CI-based analysis.
#
# Automatic Analysis is switched off for this project, so without the scan step
# in .github/workflows/ci.yml this repository gets no analysis at all.

sonar.projectKey=SuryaKiran434_cineverse-frontend
sonar.organization=suryakiran434

sonar.sources=src

# Tests live beside the code they cover, in __tests__ directories, so sources
# and tests share a root and sonar.test.inclusions separates them. Files matched
# here are analysed as test code, not scored as production source.
sonar.tests=src
sonar.test.inclusions=src/**/__tests__/**,src/**/*.test.js,src/**/*.test.jsx

# Written by `npm run test:coverage`, which runs earlier in the same CI job as
# the scan, so the report exists in this workspace by the time the scanner runs.
#
# This matters more than it looks: SonarCloud scores a file it analyses but
# cannot find in any coverage report as 0% covered rather than as unmeasured.
# Without this line the whole of src/ counted as uncovered, which is what failed
# the new_coverage condition at 0%.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.exclusions=dist/**,node_modules/**,public/**,coverage/**

sonar.sourceEncoding=UTF-8
