# SonarCloud configuration for CI-based analysis.
#
# Automatic Analysis is switched off for this project, so without the scan step
# in .github/workflows/ci.yml this repository gets no analysis at all.

sonar.projectKey=SuryaKiran434_cineverse-frontend
sonar.organization=suryakiran434

sonar.sources=src

# sonar.tests is intentionally absent: this repo has no test suite, and naming
# a directory that does not exist makes the scanner fail. Add it -- together
# with sonar.javascript.lcov.reportPaths -- when tests arrive.
#
# There is likewise no coverage report to import. This is analysis only:
# bugs, code smells, security hotspots and duplication. The coverage figure
# SonarCloud shows for this project will legitimately be empty, not 0%.

sonar.exclusions=dist/**,node_modules/**,public/**

sonar.sourceEncoding=UTF-8
